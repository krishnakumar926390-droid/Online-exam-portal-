    /* ==================== MATH RENDERING ==================== */
    function isMathOnlyText(text) {
      if (!text || /[\u0900-\u097F]/.test(text)) return false;
      return /[\/^=×÷πθ∞εμλΔΣΩ∑∫√⃗²³⁻₀₁₂₃₄₅₆₇₈₉]/.test(text);
    }

    function plainMathToTex(text) {
      let s = String(text || "").trim();
      if (!s || /(\$[^$]+\$|\\\(|\\\[)/.test(s)) return s;
      s = s.replace(/([A-Za-z])\u20D7/g, "\\vec{$1}");
      const sup = {"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁺":"+","⁻":"-"};
      const sub = {"₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7","₈":"8","₉":"9","₊":"+","₋":"-"};
      s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+/g, m => "^{" + [...m].map(x => sup[x]).join("") + "}");
      s = s.replace(/[₀₁₂₃₄₅₆₇₈₉₊₋]+/g, m => "_{" + [...m].map(x => sub[x]).join("") + "}");
      s = s.replace(/π/g, "\\pi").replace(/θ/g, "\\theta").replace(/ε/g, "\\epsilon")
           .replace(/μ/g, "\\mu").replace(/λ/g, "\\lambda").replace(/Δ/g, "\\Delta")
           .replace(/Ω/g, "\\Omega").replace(/∞/g, "\\infty").replace(/√/g, "\\sqrt{}");
      s = s.replace(/×/g, "\\times ").replace(/·/g, "\\cdot ");
      s = s.replace(/\(\s*([^()]+?)\s*\/\s*([^()]+?)\s*\)/g, "\\frac{$1}{$2}");
      s = s.replace(/(^|[\s(])([A-Za-z0-9\\{}.,]+)\s*\/\s*([A-Za-z0-9\\{}.,]+)(?=$|[\s),])/g, "$1\\frac{$2}{$3}");
      s = s.replace(/([A-Za-z])\^(-?\d+)/g, "$1^{$2}");
      return "\\(" + s + "\\)";
    }

    function preparePlainMath(root) {
      if (!root) return;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
          const parent = node.parentElement;
          if (!parent || /^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|BUTTON)$/i.test(parent.tagName)) return NodeFilter.FILTER_REJECT;
          if (!node.nodeValue || !/[\/^×÷πθ∞εμλ⃗²³⁻₀₁₂₃₄₅₆₇₈₉]/.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(function(node) {
        const value = node.nodeValue;
        if (!value || /(\$[^$]+\$|\\\(|\\\[)/.test(value)) return;
        if (isMathOnlyText(value.trim())) {
          const span = document.createElement("span");
          span.innerHTML = plainMathToTex(value);
          node.parentNode.replaceChild(span, node);
          return;
        }
      });
    }

    function renderMath(root) {
      root = root || document.getElementById("app") || document.body;
      try { preparePlainMath(root); } catch (e) {}
      if (window.MathJax) {
        const job = window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]) : (window.MathJax.typeset ? Promise.resolve(window.MathJax.typeset([root])) : Promise.resolve());
        job.catch(() => {});
      }
    }

    function openModal(title, msg, onConfirm, confirmBtnColor = "bg-rose-600 hover:bg-rose-700") {
      const mc = document.getElementById("modalContainer");
      mc.innerHTML = `
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
          <h3 class="text-base font-bold text-slate-800">${title}</h3>
          <p class="text-xs text-slate-600">${msg}</p>
          <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 rounded-xl">रद्द करें</button>
            <button id="modalConfirmBtn" class="px-4 py-2 text-xs font-bold text-white rounded-xl ${confirmBtnColor}">हाँ, जारी रखें</button>
          </div>
        </div>
      `;
      document.getElementById("modalConfirmBtn").onclick = function() {
        closeModal();
        if (onConfirm) onConfirm();
      };
      mc.classList.remove("hidden");
      mc.classList.add("flex");
    }

    function closeModal() {
      const mc = document.getElementById("modalContainer");
      mc.classList.add("hidden");
      mc.classList.remove("flex");
    }

    function navigate(viewName) {
      state.view = viewName;
      sessionStorage.setItem("sep_current_view", viewName);
      renderApp();
    }

    function handleLogoClick() {
      if (state.activeTeacher) navigate("teacher-dash");
      else navigate("student-home");
    }

    async function downloadElementAsImage(elementId, fileName) {
      const el = document.getElementById(elementId);
      if (!el) return alert("डेटा नहीं मिला!");
      try {
        const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
        const link = document.createElement("a");
        link.download = fileName + ".png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (err) { alert("डाउनलोड समस्या: " + err.message); }
    }

    function printOrDownloadPDF(printableId, titleText) {
      const el = document.getElementById(printableId);
      if (!el) return alert("डेटा नहीं मिला!");
      const printWin = window.open('', '', 'width=900,height=700');
      printWin.document.write('<!DOCTYPE html><html><head><title>' + titleText + '</title><script src="https://cdn.tailwindcss.com"><\/script></head><body class="p-6">');
      printWin.document.write('<div class="text-center pb-4 border-b mb-4"><h1 class="text-xl font-bold text-slate-800">' + titleText + '</h1></div>');
      printWin.document.write(el.innerHTML);
      printWin.document.write('</body></html>');
      printWin.document.close();
      printWin.focus();
      setTimeout(() => printWin.print(), 800);
    }

    function cacheKey(type, teacherId) { return `sep_cached_${type}_${teacherId}`; }
    function readCachedList(type, teacherId) {
      try { return JSON.parse(localStorage.getItem(cacheKey(type, teacherId)) || "[]"); } catch (e) { return []; }
    }
    function writeCachedList(type, teacherId, list) {
      try { localStorage.setItem(cacheKey(type, teacherId), JSON.stringify(Array.isArray(list) ? list : [])); } catch (e) {}
    }
    function upsertCachedItem(type, teacherId, item) {
      if (!teacherId || !item) return;
      const list = readCachedList(type, teacherId);
      const key = item.id || item.examCode || (item.examName + "_" + item.createdTimestamp);
      const idx = list.findIndex(x => (x.id || x.examCode || (x.examName + "_" + x.createdTimestamp)) === key);
      if (idx >= 0) list[idx] = { ...list[idx], ...item }; else list.push(item);
      writeCachedList(type, teacherId, list);
    }
    /* ==================== API (FIRESTORE) ==================== */
    const API = {
      async getExamByCode(code) {
        const cleanCode = (code || "").trim().toUpperCase();
        const snap = await db.collection("exams").where("examCode", "==", cleanCode).get();
        if (snap.empty) return null;
        const validDoc = snap.docs.find(d => !d.data().isDeleted);
        return validDoc ? { id: validDoc.id, ...validDoc.data() } : null;
      },

      async getTeacherExams(teacherId) {
        try {
          const snap = await db.collection("exams").get();
          const currentTeacher = state.activeTeacher;
          const tEmail = (currentTeacher?.email || "").trim().toLowerCase();
          const tName = (currentTeacher?.name || "").trim().toLowerCase();
          const tId = String(teacherId || "").trim();

          const activeExams = [];
          snap.docs.forEach(doc => {
            const d = doc.data();
            if (!d) return;
            const match = (tId && String(d.teacherId || "").trim() === tId) ||
                          (tEmail && String(d.teacherEmail || d.email || "").trim().toLowerCase() === tEmail) ||
                          (tName && String(d.teacherName || "").trim().toLowerCase() === tName);
            if (match && !d.isDeleted) {
              activeExams.push({ id: doc.id, ...d });
            }
          });
          return activeExams;
        } catch (err) {
          return readCachedList("exams", teacherId);
        }
      },

      async getTrashExams(teacherId) {
        const snap = await db.collection("exams").where("isDeleted", "==", true).get();
        return snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      },

      async saveExam(examData) {
        const todayStr = new Date().toLocaleDateString("hi-IN", { day: '2-digit', month: '2-digit', year: 'numeric' });
        if (examData.id) {
          const id = examData.id;
          delete examData.id;
          await db.collection("exams").doc(id).set(examData, { merge: true });
          return id;
        } else {
          const res = await db.collection("exams").add({
            ...examData,
            isDeleted: false,
            createdDate: todayStr,
            createdTimestamp: Date.now()
          });
          return res.id;
        }
      },

      async moveToTrash(examId) {
        await db.collection("exams").doc(examId).set({ isDeleted: true, deletedTimestamp: Date.now() }, { merge: true });
      },

      async restoreExam(examId) {
        await db.collection("exams").doc(examId).set({ isDeleted: false, deletedTimestamp: null }, { merge: true });
      },

      async permanentDeleteExam(examId) {
        await db.collection("exams").doc(examId).delete();
      },

      async submitResult(resultData) {
        const res = await db.collection("results").add({
          ...resultData,
          date: new Date().toLocaleDateString("hi-IN"),
          createdTimestamp: Date.now()
        });
        return res.id;
      },

      async updateResult(resId, updateData) {
        await db.collection("results").doc(resId).set(updateData, { merge: true });
      },

      async getResults(teacherId) {
        try {
          const snap = await db.collection("results").get();
          const currentTeacher = state.activeTeacher;
          const tEmail = (currentTeacher?.email || "").trim().toLowerCase();
          const tName = (currentTeacher?.name || "").trim().toLowerCase();
          const tId = String(teacherId || "").trim();

          const matched = [];
          snap.docs.forEach(doc => {
            const r = doc.data();
            if (!r) return;
            const match = (tId && String(r.teacherId || "").trim() === tId) ||
                          (tEmail && String(r.teacherEmail || "").trim().toLowerCase() === tEmail) ||
                          (tName && String(r.teacherName || "").trim().toLowerCase() === tName);
            if (match || !r.teacherId) matched.push({ id: doc.id, ...r });
          });
          return matched;
        } catch (err) {
          return readCachedList("results", teacherId);
        }
      },

      async getResultsByCode(examCode) {
        const snap = await db.collection("results").where("examCode", "==", examCode.trim().toUpperCase()).get();
        return snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      },

      async getStudentPortalRecords(name, sClass, sPass) {
        const snap = await db.collection("results")
          .where("studentClass", "==", sClass)
          .where("studentPasscode", "==", sPass)
          .get();
        return snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))
          .filter(r => String(r.studentName || "").trim().toLowerCase() === name.trim().toLowerCase());
      },

      async saveTeacherProfileCloud(profile) {
        await db.collection("teacherProfiles").doc(profile.id).set({
          teacherId: profile.id,
          name: profile.name || "",
          email: profile.email || "",
          photo: profile.photo || "",
          updatedTimestamp: Date.now()
        }, { merge: true });
      },

      // छात्र समस्या / सवाल सबमिट करें
      async submitStudentFeedback(feedbackData) {
        const res = await db.collection("studentFeedback").add({
          ...feedbackData,
          reply: "",
          createdTimestamp: Date.now(),
          date: new Date().toLocaleDateString("hi-IN"),
          time: new Date().toLocaleTimeString("en-US", { hour: '2-digit', minute: '2-digit' })
        });
        return res.id;
      },

      // सभी फीडबैक लाएँ (शिक्षक हेतु)
      async getStudentFeedbacks() {
        try {
          const snap = await db.collection("studentFeedback").get();
          return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        } catch (e) { return []; }
      },

      // छात्र के अपने सवाल व शिक्षक का जवाब लाएँ
      async getStudentFeedbacksByName(name) {
        try {
          const snap = await db.collection("studentFeedback").get();
          const cleanName = (name || "").trim().toLowerCase();
          return snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .filter(f => (f.studentName || "").trim().toLowerCase() === cleanName);
        } catch (e) { return []; }
      },

      // शिक्षक द्वारा उत्तर देना
      async replyToFeedback(id, replyText) {
        await db.collection("studentFeedback").doc(id).set({
          reply: replyText,
          repliedDate: new Date().toLocaleDateString("hi-IN") + " " + new Date().toLocaleTimeString("en-US", { hour: '2-digit', minute: '2-digit' })
        }, { merge: true });
      },

      async deleteStudentFeedback(id) {
        await db.collection("studentFeedback").doc(id).delete();
      },

      async deleteSingleResult(resId) {
        await db.collection("results").doc(resId).delete();
      }
    };

    async function startStudentExam() {
      const name = document.getElementById("stuName").value.trim();
      const sClass = document.getElementById("stuClass").value;
      const rollInput = document.getElementById("stuRoll").value.trim();
      const roll = rollInput ? rollInput : "N/A";
      const passcode = document.getElementById("stuPasscode").value.trim().toUpperCase();
      const code = document.getElementById("stuCode").value.trim().toUpperCase();

      if (!name || !passcode || !code) return alert("कृपया सभी विवरण भरें!");

      let exam = await API.getExamByCode(code);
      if (!exam) return alert("❌ इस कोड से कोई परीक्षा नहीं मिली!");
      if (exam.status !== "Published") return alert("यह परीक्षा अभी सक्रिय नहीं है!");

      state.studentData = { name, sClass, roll, passcode, answers: {}, secondsElapsed: 0 };
      state.activeStudentExam = exam;

      if (state.examTimerInterval) clearInterval(state.examTimerInterval);
      const isLimited = exam.timingType === "limited" && exam.durationMinutes > 0;
      state.timeLeftSeconds = isLimited ? (exam.durationMinutes * 60) : 0;

      state.examTimerInterval = setInterval(() => {
        state.studentData.secondsElapsed++;
        const el = document.getElementById("timerDisplay");
        if (isLimited) {
          state.timeLeftSeconds--;
          if (el) {
            const m = Math.floor(Math.max(0, state.timeLeftSeconds) / 60);
            const s = Math.max(0, state.timeLeftSeconds) % 60;
            el.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
          }
          if (state.timeLeftSeconds <= 0) {
            clearInterval(state.examTimerInterval);
            alert("समय समाप्त हो गया! उत्तर सबमिट हो रहे हैं।");
            submitStudentExam(true);
          }
        } else {
          if (el) {
            const m = Math.floor(state.studentData.secondsElapsed / 60);
            const s = state.studentData.secondsElapsed % 60;
            el.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
          }
        }
      }, 1000);

      navigate("student-exam");
    }

    async function submitStudentExam(forceSubmit = false) {
      if (state.examTimerInterval) clearInterval(state.examTimerInterval);
      const ex = state.activeStudentExam;
      let correctCount = 0;
      ex.questions.forEach((q, i) => {
        if (state.studentData.answers[i] === q.correctAnswer) correctCount++;
      });

      const marksPerQ = ex.marksPerQuestion || 1;
      const totalMarks = ex.questions.length * marksPerQ;
      const scoredMarks = correctCount * marksPerQ;
      const percentage = Math.round((scoredMarks / totalMarks) * 100);

      const now = new Date();
      const examTimeStr = now.toLocaleTimeString("en-US", { hour: '2-digit', minute: '2-digit', hour12: true });
      const examDateStr = now.toLocaleDateString("hi-IN", { day: '2-digit', month: '2-digit', year: 'numeric' });

      const resultPayload = {
        teacherId: ex.teacherId,
        teacherName: ex.teacherName || "",
        examId: ex.id,
        examName: ex.examName,
        examCode: ex.examCode,
        class: ex.class,
        studentClass: state.studentData.sClass,
        studentName: state.studentData.name,
        rollNumber: state.studentData.roll,
        studentPasscode: state.studentData.passcode,
        marks: scoredMarks,
        totalMarks: totalMarks,
        percentage: percentage,
        answers: state.studentData.answers,
        submissionDateTime: `${examDateStr} | ${examTimeStr}`,
        date: examDateStr
      };

      await API.submitResult(resultPayload);
      state.lastResult = resultPayload;
      navigate("student-result");
    }

    function startPhotoCropProcess(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const imageToCrop = document.getElementById("imageToCrop");
        imageToCrop.src = e.target.result;
        const cropModal = document.getElementById("cropModalContainer");
        cropModal.classList.remove("hidden");
        cropModal.classList.add("flex");
        if (cropperInstance) cropperInstance.destroy();
        setTimeout(() => {
          cropperInstance = new Cropper(imageToCrop, { aspectRatio: 1, viewMode: 1, autoCropArea: 0.9 });
        }, 150);
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }

    function closeCropModal() {
      if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null; }
      const cropModal = document.getElementById("cropModalContainer");
      cropModal.classList.add("hidden");
      cropModal.classList.remove("flex");
    }

    function applyCroppedImage() {
      if (!cropperInstance) return;
      const canvas = cropperInstance.getCroppedCanvas({ width: 300, height: 300 });
      tempPhotoBase64 = canvas.toDataURL("image/jpeg", 0.85);
      closeCropModal();
      renderTeacherProfile(document.getElementById("app"));
    }

    async function deleteTeacherPhoto() {
      tempPhotoBase64 = "";
      state.activeTeacher.photo = "";
      localStorage.setItem("sep_teacher", JSON.stringify(state.activeTeacher));
      alert("फोटो हटा दी गई!");
      renderTeacherProfile(document.getElementById("app"));
    }

    async function saveTeacherProfile() {
      const newName = document.getElementById("profName").value.trim();
      const newPass = document.getElementById("profPass").value.trim();
      if (!newName) return alert("कृपया नाम भरें!");

      const email = state.activeTeacher.email;
      const finalPhoto = tempPhotoBase64 !== null ? tempPhotoBase64 : (state.activeTeacher.photo || "");
      localStorage.setItem("teacher_auth_" + email, JSON.stringify({ name: newName, password: newPass, photo: finalPhoto }));

      state.activeTeacher.name = newName;
      state.activeTeacher.photo = finalPhoto;
      localStorage.setItem("sep_teacher", JSON.stringify(state.activeTeacher));
      await API.saveTeacherProfileCloud(state.activeTeacher);

      tempPhotoBase64 = null;
      alert("प्रोफाइल सुरक्षित हो गई!");
      navigate("teacher-dash");

    /* ==================== TEACHER DASHBOARD (WITH LIVE SEARCH & CLICKABLE STATS) ==================== */
    async function renderTeacherDashboard(c) {
      if (!state.activeTeacher) return navigate("teacher-login");

      const teacherId = state.activeTeacher.id;
      let cachedExams = readCachedList("exams", teacherId);
      let cachedResults = readCachedList("results", teacherId);

      renderFullDashboardUI(c, cachedExams, cachedResults, true);

      try {
        const [cloudExams, cloudResults] = await Promise.all([
          API.getTeacherExams(teacherId),
          API.getResults(teacherId)
        ]);

        const examMap = new Map();
        [...cachedExams, ...cloudExams].forEach(e => {
          if (!e) return;
          const k = e.id || e.examCode;
          if (k) examMap.set(k, { ...(examMap.get(k) || {}), ...e });
        });

        const resultMap = new Map();
        [...cachedResults, ...cloudResults].forEach(r => {
          if (!r) return;
          const k = r.id || `${r.examCode}_${r.studentName}_${r.submissionDateTime || r.createdTimestamp}`;
          resultMap.set(k, { ...(resultMap.get(k) || {}), ...r });
        });

        cachedExams = Array.from(examMap.values()).filter(e => !e.isDeleted);
        cachedResults = Array.from(resultMap.values());
        writeCachedList("exams", teacherId, cachedExams);
        writeCachedList("results", teacherId, cachedResults);

        renderFullDashboardUI(c, cachedExams, cachedResults, false);
      } catch (err) {
        renderFullDashboardUI(c, cachedExams, cachedResults, false);
      }
    }

    async function downloadExamPaper(examId) {
      const exams = await API.getTeacherExams(state.activeTeacher.id);
      const ex = exams.find(e => e.id === examId);
      if (!ex) return;

      const printWin = window.open('', '', 'width=900,height=700');
      printWin.document.write('<!DOCTYPE html><html><head><title>' + ex.examName + ' - Question Paper</title><script src="https://cdn.tailwindcss.com"><\/script></head><body class="p-8">');
      printWin.document.write('<div class="text-center border-b pb-4 mb-6"><h1 class="text-2xl font-black">' + ex.examName + '</h1><p class="text-sm font-bold text-slate-600">' + ex.class + ' | Subject: ' + (ex.subject || 'General') + ' | Code: ' + ex.examCode + '</p></div><div class="space-y-4 text-xs">');

      for (let i = 0; i < ex.questions.length; i++) {
        const q = ex.questions[i];
        printWin.document.write('<div class="border-b pb-3 space-y-2"><div class="font-bold text-sm">Q' + (i + 1) + '. ' + q.questionText + '</div>');
        printWin.document.write('<div class="grid grid-cols-2 gap-2 pl-4"><span>(A) ' + q.options[0] + '</span><span>(B) ' + q.options[1] + '</span><span>(C) ' + q.options[2] + '</span><span>(D) ' + q.options[3] + '</span></div>');
        printWin.document.write('<div class="text-[11px] text-emerald-700 font-bold pl-4">उत्तर: Option ' + ['A','B','C','D'][q.correctAnswer] + '</div></div>');
      }

      printWin.document.write('</div></body></html>');
      printWin.document.close();
      printWin.focus();
      setTimeout(() => printWin.print(), 1000);
    }

    function syncCurrentQuestions() {
      const ex = state.builderExam;
      if (!ex) return;
      
      const nameEl = document.getElementById("bName");
      if (nameEl) ex.examName = nameEl.value;
      const codeEl = document.getElementById("bCode");
      if (codeEl) ex.examCode = codeEl.value.trim().toUpperCase();
      const classEl = document.getElementById("bClass");
      if (classEl) ex.class = classEl.value;
      const subjEl = document.getElementById("bSubject");
      if (subjEl) ex.subject = subjEl.value;
      const marksEl = document.getElementById("bMarks");
      if (marksEl) ex.marksPerQuestion = Number(marksEl.value) || 1;
      const timeEl = document.getElementById("bTiming");

    function processBulkQuestions() {
      const rawText = document.getElementById("bulkTextInput").value.trim();
      if (!rawText) return alert("कृपया प्रश्न पेस्ट करें!");
      syncCurrentQuestions();

      let newQuestions = [];
      const qPattern = /(?:^|\n)\s*(?:(\d+)[\.\)]|Q\s*(\d+)[\.\:\-]?)\s+/gi;
      const matches = [...rawText.matchAll(qPattern)];

      if (matches.length > 0) {
        for (let i = 0; i < matches.length; i++) {
          const startIndex = matches[i].index;
          const endIndex = (i + 1 < matches.length) ? matches[i + 1].index : rawText.length;
          const block = rawText.substring(startIndex, endIndex).trim();
          const lines = block.split("\n").map(l => l.trim()).filter(l => l.length > 0);
          if (lines.length >= 5) {
            let qText = lines[0].replace(/^(\d+[\.\)]|Q\s*\d+[\.\:\-]?)\s*/i, "").trim();
            let opts = ["", "", "", ""];
            let ansIdx = 0;

            for (let j = 1; j < lines.length; j++) {
              const line = lines[j];
              if (/^[\(\[]?[A1क][\)\.\:\-]/i.test(line)) opts[0] = line.replace(/^[\(\[]?[A1क][\)\.\:\-]\s*/i, "").trim();
              else if (/^[\(\[]?[B2ख][\)\.\:\-]/i.test(line)) opts[1] = line.replace(/^[\(\[]?[B2ख][\)\.\:\-]\s*/i, "").trim();
              else if (/^[\(\[]?[C3ग][\)\.\:\-]/i.test(line)) opts[2] = line.replace(/^[\(\[]?[C3ग][\)\.\:\-]\s*/i, "").trim();
              else if (/^[\(\[]?[D4घ][\)\.\:\-]/i.test(line)) opts[3] = line.replace(/^[\(\[]?[D4घ][\)\.\:\-]\s*/i, "").trim();
              else if (/^(Ans|उत्तर|Answer|सही\s*उत्तर)[\s\:\-\.\=\(\[]+/i.test(line)) {
                const afterAns = line.replace(/^(Ans|उत्तर|Answer|सही\s*उत्तर)[\s\:\-\.\=\(\[]+/i, "").trim().toUpperCase();
                if (/[B२ख2]/.test(afterAns)) ansIdx = 1;
                else if (/[C३ग3]/.test(afterAns)) ansIdx = 2;
                else if (/[D४घ4]/.test(afterAns)) ansIdx = 3;
              }
            }
            if (qText && opts[0] && opts[1]) newQuestions.push({ questionText: qText, options: opts, correctAnswer: ansIdx });
          }
        }
      }

      if (newQuestions.length === 0) return alert("फॉर्मेट समझ नहीं आया! 1. प्रश्न और (A),(B),(C),(D) विकल्प दें।");

      if (state.builderExam.questions.length === 1 && !state.builderExam.questions[0].questionText.trim()) {
        state.builderExam.questions = newQuestions;
      } else {
        state.builderExam.questions = state.builderExam.questions.concat(newQuestions);
      }
      alert(`कुल ${newQuestions.length} प्रश्न लोड हो गए!`);
      renderCreateExam(document.getElementById("app"));
    }

    function addNewBlankQuestion(insertIndex = null) {
      syncCurrentQuestions();
      const newQ = { questionText: "", options: ["", "", "", ""], correctAnswer: 0 };
      if (insertIndex !== null) state.builderExam.questions.splice(insertIndex, 0, newQ);

                <div class="bg-amber-50/60 p-3 rounded-xl border border-amber-200 text-xs text-slate-700 whitespace-pre-wrap font-medium">${fb.message}</div>
                
                <!-- शिक्षक रिप्लाई बॉक्स -->
                <div class="pt-1">
                  ${fb.reply ? `
                    <div class="p-2.5 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800">
                      <strong>✅ आपका जवाब:</strong> ${fb.reply}
                      <button onclick="openReplyInputModal('${fb.id}')" class="ml-2 text-indigo-600 underline text-[11px]">बदलें</button>
                    </div>
                  ` : `
                    <button onclick="openReplyInputModal('${fb.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow">
                      ✍️ जवाब लिखें (Reply)
                    </button>
                  `}
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function openReplyInputModal(fbId) {
      const reply = prompt("विद्यार्थी के सवाल का जवाब यहाँ लिखें:");
      if (reply && reply.trim()) {
        API.replyToFeedback(fbId, reply.trim()).then(() => {
          alert("उत्तर भेज दिया गया!");
          renderTeacherFeedbacks(document.getElementById('app'));
        });
      }
    }

    async function deleteFeedbackNow(id) {
      if (confirm("क्या आप इसे हटाना चाहते हैं?")) {
        await API.deleteStudentFeedback(id);
        renderTeacherFeedbacks(document.getElementById('app'));
      }
    }

    /* ==================== APP ROUTING ==================== */
    function renderApp() {
      const app = document.getElementById("app");
      const navArea = document.getElementById("navAuthArea");

      if (state.activeTeacher) {
        navArea.innerHTML = `
          <button onclick="navigate('teacher-dash')" class="text-xs bg-indigo-800 text-white px-3 py-1.5 rounded-xl font-bold">डैशबोर्ड</button>
          <button onclick="navigate('student-home')" class="text-xs bg-amber-500 text-white px-3 py-1.5 rounded-xl font-bold">Student Portal</button>
          <button onclick="handleTeacherLogout()" class="text-xs bg-rose-600 text-white px-3 py-1.5 rounded-xl font-bold">Logout</button>
        `;
      } else {
        navArea.innerHTML = `
          <button onclick="navigate('student-portal-login')" class="text-xs bg-amber-500 text-white px-3 py-1.5 rounded-xl font-bold">Student Portal</button>
          <button onclick="navigate('teacher-login')" class="text-xs bg-white text-indigo-700 px-3 py-1.5 rounded-xl font-bold">Teacher Login</button>
        `;
      }

      switch (state.view) {
        case "student-home": renderStudentHome(app); break;
        case "student-exam": renderStudentExam(app); break;
        case "student-result": renderStudentResult(app); break;
        case "student-feedback": renderStudentFeedback(app); break;
        case "student-view-replies": renderStudentViewReplies(app); break;
        case "student-portal-login": renderStudentPortalLogin(app); break;
        case "student-portal-view": renderStudentPortalView(app); break;
        case "teacher-feedbacks": renderTeacherFeedbacks(app); break;
        case "teacher-login": renderTeacherLogin(app); break;
        case "teacher-dash": renderTeacherDashboard(app); break;
        case "teacher-trash": renderTeacherTrash(app); break;
        case "teacher-profile": renderTeacherProfile(app); break;
        case "create-exam": renderCreateExam(app); break;
        case "teacher-results": renderTeacherResults(app); break;
        case "merit-list": renderMeritList(app); break;
        default: renderStudentHome(app);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (state.activeTeacher) navigate("teacher-dash");
      else navigate("student-home");
    });
  </script>
</body>
</html>
