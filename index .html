  <script>
    /* ==================== 1. FIREBASE CONNECTION ==================== */
    const firebaseConfig = {
      apiKey: "AIzaSyCNZQE09U86piWrHItnrl6gOj5lp5odCIc",
      authDomain: "online-smartexam.firebaseapp.com",
      projectId: "online-smartexam",
      storageBucket: "online-smartexam.firebasestorage.app",
      messagingSenderId: "496019627434",
      appId: "1:496019627434:web:86920fd700a85f1e529fd3",
      measurementId: "G-DG0KG9N2TL"
    };

    let db = null;

      if (typeof firebase !== "undefined") {

          firebase.initializeApp(firebaseConfig);

    let state = {

      activeStudent: JSON.parse(localStorage.getItem("sep_student") || "null"),

      selectedStream: localStorage.getItem("sep_selected_stream") || "Science",
      activeStudentExam: null,
      examRunState: {
        answers: {},
        secondsElapsed: 0,
        timerInterval: null
      },
      builderExam: null,
      examSortOrder: "az",
      examSearchQuery: "",
      examSubjectFilter: "All",
      meritFilterCode: "",
      lastResultPayload: null,

    let examSaveInProgress = false;

    /* ==================== 3. UTILITIES & MATH ==================== */
    function openModal(title, msg, onConfirm, confirmBtnColor = "bg-rose-600 hover:bg-rose-700") {
      const mc = document.getElementById("modalContainer");
      mc.innerHTML = `
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
          <h3 class="text-base font-bold text-slate-800">${title}</h3>
          <p class="text-xs text-slate-600 leading-relaxed">${msg}</p>
          <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 rounded-xl">रद्द करें</button>
            <button id="modalConfirmBtn" class="px-4 py-2 text-xs font-bold text-white rounded-xl ${confirmBtnColor}">हाँ, जारी रखें</button>
          </div>
        </div>
      `;
      document.getElementById("modalConfirmBtn").onclick = () => { closeModal(); if (onConfirm) onConfirm(); };
      mc.classList.remove("hidden");
      mc.classList.add("flex");
    }

    function closeModal() {
      const mc = document.getElementById("modalContainer");
      mc.classList.add("hidden");
      mc.classList.remove("flex");
    }

    function navigate(viewName) {
      state.view = viewName;
      renderApp();
    }

    function handleLogoClick() {
      if (state.activeTeacher) navigate("teacher-dash");
      else if (state.activeStudent) navigate("student-dashboard");
      else navigate("student-home");
    }

    function renderMath(root) {
      root = root || document.getElementById("app") || document.body;
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([root]).catch(() => {});
      }
    }

    function launchConfetti() {
      const container = document.getElementById("confettiContainer");
      if (!container) return;
      container.innerHTML = "";
      const colors = ["#f59e0b", "#ef4444", "#10b981", "#3b82f6", "#ec4899", "#8b5cf6"];
      for (let i = 0; i < 80; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.setProperty("--dx", (Math.random() * 300 - 150) + "px");
        piece.style.animationDelay = (Math.random() * 0.6) + "s";
        container.appendChild(piece);
      }
      setTimeout(() => { container.innerHTML = ""; }, 3000);
    }

    async function downloadElementAsImage(elementId, fileName) {
      const el = document.getElementById(elementId);
      if (!el) return alert("डेटा नहीं मिला!");
      try {
        const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
        const link = document.createElement("a");
        link.download = fileName + ".png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (err) { alert("डाउनलोड समस्या: " + err.message); }
    }

    function printOrDownloadPDF(printableId, titleText) {
      const el = document.getElementById(printableId);
      if (!el) return alert("डेटा नहीं मिला!");
      const printWin = window.open('', '', 'width=900,height=700');
      printWin.document.write('<!DOCTYPE html><html><head><title>' + titleText + '</title><script src="https://cdn.tailwindcss.com"></' + 'script></head><body class="p-6">');
      printWin.document.write('<div class="text-center pb-4 border-b mb-4"><h1 class="text-xl font-bold text-slate-800">' + titleText + '</h1></div>');
      printWin.document.write(el.innerHTML);
      printWin.document.write('</body></html>');
      printWin.document.close();
      printWin.focus();
      setTimeout(() => printWin.print(), 800);
    }
    /* ==================== 4. DATA ENGINE (STUDENT & EXAMS API) ==================== */
    const API = {
      async getStudents() {
        if (db) {
          try {
            const snap = await db.collection("students").get();
            if (!snap.empty) return snap.docs.map(d => ({ id: d.id, ...d.data() }));
          } catch (e) {}
        }
        return JSON.parse(localStorage.getItem("sep_students_db") || "[]");
      },

      async saveStudent(student) {
        if (db) {
          try {
            const res = await db.collection("students").add(student);
            return res.id;
          } catch (e) {}
        }
        const list = JSON.parse(localStorage.getItem("sep_students_db") || "[]");
        student.id = "STU_" + Date.now();
        list.push(student);
        localStorage.setItem("sep_students_db", JSON.stringify(list));
        return student.id;
      },

      async getExams() {
        const now = Date.now();
        const fifteenDaysMs = 15 * 24 * 60 * 60 * 1000;
        let cloudExams = [];
        if (db) {
          try {
            const snap = await db.collection("exams").get();
            cloudExams = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          } catch (e) {}
        }

        const local1 = JSON.parse(localStorage.getItem("sep_exams_db") || "[]");
        const local2 = JSON.parse(localStorage.getItem("sep_all_exams") || "[]");
        const teacher = state.activeTeacher;
        const local3 = teacher ? JSON.parse(localStorage.getItem(`sep_cached_exams_${teacher.id}`) || "[]") : [];

        const examMap = new Map();
        [...local1, ...local2, ...local3, ...cloudExams].forEach(e => {
          if (!e) return;
          const k = e.id || e.examCode;
          if (k) examMap.set(k, { ...(examMap.get(k) || {}), ...e });
        });

        const validExams = [];
        examMap.forEach(ex => {
          if (ex.isDeleted && ex.deletedTimestamp && (now - ex.deletedTimestamp > fifteenDaysMs)) {
            // 15 दिनों से पुराने डिलीटेड डेटा को स्वतः हटाएँ
          } else {
            validExams.push(ex);
          }
        });

        localStorage.setItem("sep_exams_db", JSON.stringify(validExams));
        localStorage.setItem("sep_all_exams", JSON.stringify(validExams));
        return validExams;
      },

      async saveExam(examData) {
        examData.examCode = String(examData.examCode || "").trim().toUpperCase();
        examData.updatedTimestamp = Date.now();
        const todayStr = new Date().toLocaleDateString("hi-IN");

        if (db) {
          try {
            if (examData.id) {
              const id = examData.id;
              delete examData.id;
              await db.collection("exams").doc(id).set(examData, { merge: true });
              return id;
            } else {
              examData.createdDate = todayStr;
              examData.createdTimestamp = Date.now();
              examData.isDeleted = false;
              const res = await db.collection("exams").add(examData);
              return res.id;
            }
          } catch (e) {}
        }

        const list = await this.getExams();
        if (examData.id) {
          const idx = list.findIndex(e => e.id === examData.id);
          if (idx >= 0) list[idx] = { ...list[idx], ...examData };
          localStorage.setItem("sep_exams_db", JSON.stringify(list));
          return examData.id;
        } else {
          const newId = "EXAM_" + Date.now();
          examData.id = newId;
          examData.createdDate = todayStr;
          examData.createdTimestamp = Date.now();
          examData.isDeleted = false;
          list.push(examData);
          localStorage.setItem("sep_exams_db", JSON.stringify(list));
          return newId;
        }
      },

      async setExamTrashState(examId, isDeleted) {
        if (db) {
          try {
            await db.collection("exams").doc(examId).set({
              isDeleted: isDeleted,
              deletedTimestamp: isDeleted ? Date.now() : null
            }, { merge: true });
          } catch (e) {}
        }
        const list = await this.getExams();
        const item = list.find(e => e.id === examId);
        if (item) {
          item.isDeleted = isDeleted;
          item.deletedTimestamp = isDeleted ? Date.now() : null;
          localStorage.setItem("sep_exams_db", JSON.stringify(list));
        }
      },

      async permanentDeleteExam(examId) {
        if (db) {
          try { await db.collection("exams").doc(examId).delete(); } catch (e) {}
        }
        let list = await this.getExams();
        list = list.filter(e => e.id !== examId);
        localStorage.setItem("sep_exams_db", JSON.stringify(list));
      },
      async getResults() {
        let cloudResults = [];
        if (db) {
          try {
            const snap = await db.collection("results").get();
            if (!snap.empty) cloudResults = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          } catch (e) {}
        }
        const local1 = JSON.parse(localStorage.getItem("sep_results_db") || "[]");
        const local2 = JSON.parse(localStorage.getItem("sep_results") || "[]");

        const resultMap = new Map();
        [...local1, ...local2, ...cloudResults].forEach(r => {
          if (!r) return;
          const k = r.id || `${r.examCode}_${r.studentUsername || r.studentName}_${r.createdTimestamp}`;
          resultMap.set(k, { ...(resultMap.get(k) || {}), ...r });
        });
        const list = Array.from(resultMap.values());
        localStorage.setItem("sep_results_db", JSON.stringify(list));
        return list;
      },

      async submitResult(resultData) {
        resultData.createdTimestamp = Date.now();
        resultData.date = new Date().toLocaleDateString("hi-IN");
        resultData.time = new Date().toLocaleTimeString("en-US", { hour: '2-digit', minute: '2-digit', hour12: true });

        if (db) {
          try {
            const res = await db.collection("results").add(resultData);
            return res.id;
          } catch (e) {}
        }
        const list = await this.getResults();
        resultData.id = "RES_" + Date.now();
        list.push(resultData);
        localStorage.setItem("sep_results_db", JSON.stringify(list));
        return resultData.id;
      },

      async deleteResult(id) {
        if (db) {
          try { await db.collection("results").doc(id).delete(); } catch (e) {}
        }
        let list = await this.getResults();
        list = list.filter(r => r.id !== id);
        localStorage.setItem("sep_results_db", JSON.stringify(list));
      },

      async getMessages() {
        if (db) {
          try {
            const snap = await db.collection("studentFeedback").get();
            return snap.docs.map(d => ({ id: d.id, ...d.data() }));
          } catch (e) {}
        }
        return JSON.parse(localStorage.getItem("sep_chat_db") || "[]");
      },

      async sendMessage(msg) {
        msg.createdTimestamp = Date.now();
        msg.date = new Date().toLocaleDateString("hi-IN") + " " + new Date().toLocaleTimeString("en-US", { hour: '2-digit', minute: '2-digit' });
        if (db) {
          try { await db.collection("studentFeedback").add(msg); return; } catch (e) {}
        }
        const list = JSON.parse(localStorage.getItem("sep_chat_db") || "[]");
        list.push(msg);
        localStorage.setItem("sep_chat_db", JSON.stringify(list));
      },

      async replyMessage(id, replyText) {
        if (db) {
          try {
            await db.collection("studentFeedback").doc(id).set({
              reply: replyText,
              repliedDate: new Date().toLocaleDateString("hi-IN")
            }, { merge: true });
            return;
          } catch (e) {}
        }
        const list = JSON.parse(localStorage.getItem("sep_chat_db") || "[]");
        const target = list.find(m => m.id === id);
        if (target) { target.reply = replyText; target.repliedDate = new Date().toLocaleDateString("hi-IN"); }
        localStorage.setItem("sep_chat_db", JSON.stringify(list));
      }
    };
    /* ==================== 5. NOTICE & STUDENT AUTH ==================== */
    function checkNoticeBanner() {
      const banner = document.getElementById("noticeBanner");
      if (!banner) return;
      const notice = state.notice;
      if (notice && notice.expiresAt && Date.now() < notice.expiresAt) {
        banner.innerHTML = `
          <div class="bg-gradient-to-r from-amber-500/10 via-orange-500/10 to-rose-500/10 border border-amber-300 p-3.5 rounded-2xl flex items-center justify-between text-xs text-amber-900 shadow-sm">
            <div class="flex items-center gap-2">
              <span class="text-base">📢</span>
              <span><strong>शिक्षक सूचना (${notice.targetClass || 'सभी वर्ग'}):</strong> ${notice.text}</span>
            </div>
            <span class="text-[10px] text-amber-700 font-mono font-bold">${Math.ceil((notice.expiresAt - Date.now()) / 60000)} मि. शेष</span>
          </div>
        `;
        banner.classList.remove("hidden");
      } else {
        banner.classList.add("hidden");
      }
    }

            </div>
            <div>

            <div>
              <label class="font-bold text-slate-700">गुप्त पासवर्ड बनाएँ *</label>

    function toggleAuthTab(type) {
      const lBox = document.getElementById("loginFormBox");
      const rBox = document.getElementById("registerFormBox");
      const lBtn = document.getElementById("tabBtnLogin");
      const rBtn = document.getElementById("tabBtnReg");
      if (type === "login") {
        lBox.classList.remove("hidden");
        rBox.classList.add("hidden");
        lBtn.className = "flex-1 py-2 rounded-xl bg-white shadow-sm text-indigo-700";
        rBtn.className = "flex-1 py-2 rounded-xl text-slate-600";
      } else {
        lBox.classList.add("hidden");
        rBox.classList.remove("hidden");
        rBtn.className = "flex-1 py-2 rounded-xl bg-white shadow-sm text-indigo-700";
        lBtn.className = "flex-1 py-2 rounded-xl text-slate-600";
      }
    }

    async function handleStudentRegistration() {
      const name = document.getElementById("regFullName").value.trim();
      const sClass = document.getElementById("regClass").value;
      const roll = document.getElementById("regRoll").value.trim() || "N/A";
      const user = document.getElementById("regUser").value.trim().toUpperCase();
      const pass = document.getElementById("regPass").value.trim();

      if (!name || !user || !pass) return alert("कृपया सभी विवरण भरें!");

      const all = await API.getStudents();
      if (all.some(s => s.username === user)) {
        return alert("❌ यह यूज़रनेम पहले से पंजीकृत है! कृपया दूसरा यूज़रनेम चुनें।");
      }

      const newStudent = { id: "STU_" + Date.now(), name, class: sClass, roll, username: user, password: pass };

    async function startStudentLiveExam(examId) {
      const exams = await API.getExams();
      const ex = exams.find(e => e.id === examId);
      if (!ex) return alert("परीक्षा नहीं मिली!");

      state.activeStudentExam = ex;
      state.examRunState = {
        answers: {},
        secondsElapsed: 0,
        timerInterval: null
      };

      if (state.examRunState.timerInterval) clearInterval(state.examRunState.timerInterval);
      state.examRunState.timerInterval = setInterval(() => {
        state.examRunState.secondsElapsed++;
        const el = document.getElementById("liveExamTimer");
        if (el) {
          const m = Math.floor(state.examRunState.secondsElapsed / 60);
          const s = state.examRunState.secondsElapsed % 60;
          el.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
        }

        if (ex.timingType === "limited" && ex.durationMinutes > 0) {
          const maxSec = ex.durationMinutes * 60;
          if (state.examRunState.secondsElapsed >= maxSec) {
            clearInterval(state.examRunState.timerInterval);
            alert("⏰ निर्धारित समय समाप्त हो गया! उत्तर स्वतः सबमिट हो रहे हैं।");
            submitStudentExamAction(true);
          }
        }
      }, 1000);

      navigate("live-exam");
    }

      openModal("परीक्षा सबमिट करें?", `आप कुल ${totalQ} में से ${attempted} प्रश्न हल कर चुके हैं। क्या आप अभी सबमिट करना चाहते हैं?`, () => submitStudentExamAction(false), "bg-emerald-600 hover:bg-emerald-700");

    async function submitStudentExamAction(auto = false) {
      if (state.examRunState.timerInterval) clearInterval(state.examRunState.timerInterval);
      const ex = state.activeStudentExam;
      const student = state.activeStudent;
      const answers = state.examRunState.answers;
      const secElapsed = state.examRunState.secondsElapsed;

      let correctCount = 0;
      ex.questions.forEach((q, i) => {
        if (answers[i] === q.correctAnswer) correctCount++;
      });

      const marksPerQ = ex.marksPerQuestion || 1;
      const totalMarks = ex.questions.length * marksPerQ;
      const scoredMarks = correctCount * marksPerQ;
      const percentage = Math.round((scoredMarks / totalMarks) * 100);

      const m = Math.floor(secElapsed / 60);
      const s = secElapsed % 60;
      const timeSpentStr = `${m} मिनट ${s} सेकंड`;

      const resultPayload = {
        studentId: student.id || student.username,
        studentName: student.name,
        studentUsername: student.username,
        studentClass: student.class,
        examId: ex.id,
        examName: ex.examName,
        examCode: ex.examCode,
        instituteName: ex.instituteName || "",
        subject: ex.subject || "General",
        chapter: ex.chapter || "",
        scoredMarks,
        totalMarks,
        percentage,
        timeSpentSeconds: secElapsed,
        timeSpentText: timeSpentStr,
        answers: answers
      };

      await API.submitResult(resultPayload);
      state.lastResultPayload = resultPayload;
      launchConfetti();
      navigate("student-result");
    }

    async function uploadQuestionDiagram(index, event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 800;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          state.builderExam.questions[index].imageUrl = canvas.toDataURL("image/jpeg", 0.7);
          renderCreateExam(document.getElementById("app"));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function processBulkTextAction() {
      const raw = document.getElementById("bulkPasteArea").value.trim();
      if (!raw) return alert("कृपया प्रश्न पेस्ट करें!");
      syncBuilderFields();

      const qPattern = /(?:^|\n)\s*(?:(\d+)[\.\)]|Q\s*(\d+)[\.\:\-]?)\s+/gi;
      const matches = [...raw.matchAll(qPattern)];
      let loaded = [];

      if (matches.length > 0) {
        for (let i = 0; i < matches.length; i++) {
          const start = matches[i].index;
          const end = (i + 1 < matches.length) ? matches[i + 1].index : raw.length;
          const lines = raw.substring(start, end).trim().split("\n").map(l => l.trim()).filter(Boolean);
          if (lines.length >= 5) {
            let qText = lines[0].replace(/^(\d+[\.\)]|Q\s*\d+[\.\:\-]?)\s*/i, "").trim();
            let opts = ["", "", "", ""];
            let ans = 0;
            for (let j = 1; j < lines.length; j++) {
              const l = lines[j];
              if (/^[\(\[]?[A1क][\)\.\:\-]/i.test(l)) opts[0] = l.replace(/^[\(\[]?[A1क][\)\.\:\-]\s*/i, "").trim();
              else if (/^[\(\[]?[B2ख][\)\.\:\-]/i.test(l)) opts[1] = l.replace(/^[\(\[]?[B2ख][\)\.\:\-]\s*/i, "").trim();
              else if (/^[\(\[]?[C3ग][\)\.\:\-]/i.test(l)) opts[2] = l.replace(/^[\(\[]?[C3ग][\)\.\:\-]\s*/i, "").trim();
              else if (/^[\(\[]?[D4घ][\)\.\:\-]/i.test(l)) opts[3] = l.replace(/^[\(\[]?[D4घ][\)\.\:\-]\s*/i, "").trim();
              else if (/^(Ans|उत्तर|Answer)[\s\:\-\.\=\(\[]+/i.test(l)) {
                const u = l.toUpperCase();
                if (/[B२ख2]/.test(u)) ans = 1;
                else if (/[C३ग3]/.test(u)) ans = 2;
                else if (/[D४घ4]/.test(u)) ans = 3;
              }
            }
            if (qText && opts[0]) loaded.push({ questionText: qText, options: opts, correctAnswer: ans, imageUrl: "" });
          }
        }
      }

      if (loaded.length === 0) return alert("फॉर्मेट समझ नहीं आया! 1. प्रश्न और (A),(B),(C),(D) विकल्प लिखें।");
      if (state.builderExam.questions.length === 1 && !state.builderExam.questions[0].questionText.trim()) {
        state.builderExam.questions = loaded;
      } else {
        state.builderExam.questions = state.builderExam.questions.concat(loaded);
      }
      alert(`कुल ${loaded.length} प्रश्न लोड हो गए!`);
      renderCreateExam(document.getElementById("app"));
    }

                <div><strong>सवाल:</strong> ${m.message || m.text}</div>
                <div class="p-2 bg-indigo-50 border rounded-xl text-indigo-900">
                  <strong>सर का जवाब:</strong> ${m.reply || '<span class="text-amber-600">⏳ प्रतीक्षारत...</span>'}
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    async function submitStudentMsg() {
      const text = document.getElementById("chatInput").value.trim();
      if (!text) return alert("कृपया सवाल लिखें!");
      const stu = state.activeStudent;
      await API.sendMessage({
        studentUsername: stu.username,
        studentName: stu.name,
        studentClass: stu.class,
        message: text,
        reply: ""
      });
      alert("सवाल भेज दिया गया!");
      renderStudentChat(document.getElementById("app"));
    }

    async function renderTeacherChat(c) {
      const msgs = await API.getMessages();
      msgs.sort((a, b) => (b.createdTimestamp || 0) - (a.createdTimestamp || 0));

      c.innerHTML = `
        <div class="max-w-2xl mx-auto space-y-4 text-xs">
          <div class="flex justify-between items-center bg-white p-4 rounded-3xl border shadow-sm">
            <h2 class="font-bold text-slate-800 text-base">📬 विद्यार्थियों के सवाल (${msgs.length})</h2>
            <button onclick="navigate('teacher-dash')" class="bg-slate-800 text-white px-3 py-1.5 rounded-xl font-bold">← Dashboard</button>
          </div>
          <div class="space-y-3">
            ${msgs.length === 0 ? '<p class="text-center text-slate-400 py-8 bg-white rounded-3xl border">कोई सवाल नहीं है।</p>' : msgs.map(m => `
              <div class="bg-white border p-4 rounded-2xl space-y-2 shadow-sm">
                <div class="flex justify-between font-bold text-slate-800">
                  <span>${m.studentName} (${m.studentClass})</span>
                  <span class="text-[10px] text-slate-400 font-mono">${m.date || ''}</span>
                </div>
                <p class="bg-slate-50 p-2.5 rounded-xl border">${m.message || m.text}</p>
                <div>
                  ${m.reply ? `
                    <div class="p-2 bg-emerald-50 text-emerald-800 rounded-xl border">
                      <strong>✅ आपका जवाब:</strong> ${m.reply}
                    </div>
                  ` : `
                    <button onclick="openReplyModalAction('${m.id}')" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl font-bold">
                      ✍️ जवाब लिखें (Reply)
                    </button>
                  `}
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function openReplyModalAction(id) {
      const r = prompt("विद्यार्थी को उत्तर लिखें:");
      if (r && r.trim()) {
        API.replyMessage(id, r.trim()).then(() => {
          alert("उत्तर भेज दिया गया!");
          renderTeacherChat(document.getElementById("app"));
        });
      }
    }
    /* ==================== 9. SAFE APP ROUTING & AUTO BOOT ==================== */
    function renderApp() {
      try {
        const rawTeacher = localStorage.getItem("sep_teacher");
        state.activeTeacher = (rawTeacher && rawTeacher !== "null") ? JSON.parse(rawTeacher) : null;
        const rawStudent = localStorage.getItem("sep_student");
        state.activeStudent = (rawStudent && rawStudent !== "null") ? JSON.parse(rawStudent) : null;
      } catch (e) {}

      const app = document.getElementById("app");
      const navArea = document.getElementById("navAuthArea");
      if (!app) return;

      if (navArea) {
        if (state.activeTeacher) {
          navArea.innerHTML = `
            <button onclick="navigate('teacher-dash')" class="text-xs bg-indigo-900 text-white px-3 py-1.5 rounded-xl font-bold">डैशबोर्ड</button>
            <button onclick="navigate('student-dashboard')" class="text-xs bg-amber-500 text-white px-3 py-1.5 rounded-xl font-bold">छात्र पोर्टल</button>
            <button onclick="handleTeacherLogout()" class="text-xs bg-rose-600 text-white px-3 py-1.5 rounded-xl font-bold">Logout</button>
          `;
        } else if (state.activeStudent) {
          navArea.innerHTML = `
            <button onclick="navigate('student-dashboard')" class="text-xs bg-indigo-900 text-white px-3 py-1.5 rounded-xl font-bold">Arena</button>
            <button onclick="handleStudentLogout()" class="text-xs bg-rose-600 text-white px-3 py-1.5 rounded-xl font-bold">Logout</button>
          `;
        } else {
          navArea.innerHTML = `
            <button onclick="navigate('student-login')" class="text-xs bg-amber-500 text-white px-3 py-1.5 rounded-xl font-bold shadow">Student Login</button>
            <button onclick="navigate('teacher-login')" class="text-xs bg-white text-indigo-700 px-3 py-1.5 rounded-xl font-bold shadow">Teacher Login</button>
          `;
        }
      }

      switch (state.view) {
        case "student-home":
        case "student-login": renderStudentLogin(app); break;
        case "student-dashboard": renderStudentDashboard(app); break;
        case "live-exam": renderLiveExam(app); break;
        case "student-result": renderStudentResult(app); break;
        case "student-records": renderStudentRecords(app); break;
        case "student-chat": renderStudentChat(app); break;
        case "teacher-login": renderTeacherLogin(app); break;
        case "teacher-dash":
        case "teacher-dashboard": renderTeacherDashboard(app); break;
        case "create-exam": renderCreateExam(app); break;
        case "merit-list": renderMeritList(app); break;
        case "teacher-trash": renderTeacherTrash(app); break;
        case "teacher-broadcast": renderTeacherBroadcast(app); break;
        case "teacher-students": renderTeacherStudents(app); break;
        case "teacher-chat": renderTeacherChat(app); break;
        default: renderStudentLogin(app); break;
      }
    }

    function bootPortal() {
      try {
        const rawTeacher = localStorage.getItem("sep_teacher");
        if (rawTeacher && rawTeacher !== "null") {
          state.activeTeacher = JSON.parse(rawTeacher);
          state.view = "teacher-dash";
        } else {
          const rawStudent = localStorage.getItem("sep_student");
          if (rawStudent && rawStudent !== "null") {
            state.activeStudent = JSON.parse(rawStudent);
            state.view = "student-dashboard";
          } else {
            state.view = "student-login";
          }
        }
      } catch (e) {
        state.view = "student-login";
      }
      renderApp();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", bootPortal);
    } else {
      bootPortal();
    }
  </script>
</body>
</html>
