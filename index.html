<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Exam Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Canvas Confetti for Results -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <!-- Firebase Scripts (Compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea * { visibility: visible; }
      #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <!-- Top Navigation Header -->
  <header class="bg-gradient-to-r from-indigo-700 via-indigo-600 to-purple-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
        <div class="bg-white p-2 rounded-xl text-indigo-700 shadow-inner flex items-center justify-center">
          <i class="fa-solid fa-graduation-cap text-xl"></i>
        </div>
        <div>
          <h1 class="text-base md:text-lg font-black tracking-wide leading-tight">Smart Exam Portal</h1>
          <p class="text-[10px] text-indigo-100 font-medium">Online Examination Platform</p>
        </div>
      </div>
      <div class="flex items-center gap-2" id="navActions">
        <button onclick="navigate('teacher-dash')" class="bg-indigo-800/80 hover:bg-indigo-900 text-xs px-3 py-1.5 rounded-lg border border-indigo-500 font-semibold transition">डैशबोर्ड</button>
        <button onclick="navigate('student-home')" class="bg-amber-500 hover:bg-amber-600 text-xs px-3 py-1.5 rounded-lg font-bold text-slate-900 shadow transition">Student Portal</button>
        <button onclick="logoutTeacher()" class="bg-rose-600 hover:bg-rose-700 text-xs px-3 py-1.5 rounded-lg font-bold transition">Logout</button>
      </div>
    </div>
  </header>

  <!-- Main Dynamic View Container -->
  <main id="app" class="max-w-5xl mx-auto p-4 pb-20"></main>

  <script>
    /* ==================== FIREBASE CONFIGURATION ==================== */
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKey-ReplaceWithYourOwnIfDifferent",
      authDomain: "smartexam-portal.firebaseapp.com",
      projectId: "smartexam-portal",
      storageBucket: "smartexam-portal.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
        /* ==================== GLOBAL STATE ==================== */
    const state = {
      activeTeacher: null,
      activeStudent: null,
      activeStudentExam: null,
      lastResult: null,
      builderExam: null,
      currentQuestions: [],
      examSearchQuery: '',
      examClassFilter: 'All',
      examSortOrder: 'az'
    };

    // शिक्षक डेटा को लोकल स्टोरेज से सुरक्षित रूप से लोड करें
    try {
      const savedTeacher = localStorage.getItem("sep_teacher");
      if (savedTeacher) {
        state.activeTeacher = JSON.parse(savedTeacher);
      }
    } catch (e) {
      console.error("Local storage load error:", e);
    }

    if (!state.activeTeacher) {
      state.activeTeacher = { id: "teacher_default", name: "Krishna Sir", email: "krishna@portal.com", photo: "" };
    }

    /* ==================== UTILS & HELPERS ==================== */
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleDateString("hi-IN", { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function readCachedList(type, teacherId) {
      try {
        const raw = localStorage.getItem(`sep_${type}_${teacherId}`);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function writeCachedList(type, teacherId, list) {
      try {
        localStorage.setItem(`sep_${type}_${teacherId}`, JSON.stringify(list || []));
      } catch (e) {}
    }

    function upsertCachedItem(type, teacherId, item) {
      let list = readCachedList(type, teacherId);
      const idx = list.findIndex(x => (x.id && x.id === item.id) || (x.examCode && x.examCode === item.examCode));
      if (idx >= 0) {
        list[idx] = { ...list[idx], ...item };
      } else {
        list.unshift(item);
      }
      writeCachedList(type, teacherId, list);
    }

    // फ़ोटो को ऑटोमैटिक कंप्रेस करके Base64 में बदलने का फ़ंक्शन
    function compressAndConvertImage(file, callback) {
      if (!file) return callback(null);
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;
          const maxDim = 800; // अधिकतम 800px तक रिसाइज़
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.7);
          callback(compressedDataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // प्रश्न फ़ोटो चुनने और हटाने के ग्लोबल हैंडलर
    window.onQuestionImagePick = function(event, index) {
      const file = event.target.files[0];
      if (!file) return;
      compressAndConvertImage(file, function(base64Url) {
        if (base64Url && state.builderExam && state.builderExam.questions && state.builderExam.questions[index]) {
          state.builderExam.questions[index].imageUrl = base64Url;
          syncCurrentQuestions();
          renderCreateExam(document.getElementById('app'));
        }
      });
    };

    window.removeQuestionImage = function(index) {
      if (state.builderExam && state.builderExam.questions && state.builderExam.questions[index]) {
        delete state.builderExam.questions[index].imageUrl;
        syncCurrentQuestions();
        renderCreateExam(document.getElementById('app'));
      }
    };
        /* ==================== API (FIRESTORE) ==================== */
    const API = {
      async getTeacherExams(teacherId) {
        try {
          const snap = await db.collection("exams").get();
          const activeExams = [];
          const seenCodes = new Set();

          snap.docs.forEach(doc => {
            const d = doc.data();
            if (d && !d.isDeleted) {
              const codeKey = String(d.examCode || doc.id).trim().toUpperCase();
              // डुप्लिकेट परीक्षाओं को छोड़कर केवल 1 अद्वितीय परीक्षा रखेगा
              if (!seenCodes.has(codeKey)) {
                seenCodes.add(codeKey);
                activeExams.push({ id: doc.id, ...d });
              }
            }
          });

          if (activeExams.length > 0) {
            writeCachedList("exams", teacherId, activeExams);
          }
          return activeExams;
        } catch (err) {
          return readCachedList("exams", teacherId) || [];
        }
      },

      async getResults(teacherId) {
        try {
          const snap = await db.collection("results").get();
          const list = [];
          snap.docs.forEach(doc => {
            const d = doc.data();
            if (d && !d.isDeleted) list.push({ id: doc.id, ...d });
          });
          if (list.length > 0) {
            writeCachedList("results", teacherId, list);
          }
          return list;
        } catch (err) {
          return readCachedList("results", teacherId) || [];
        }
      },

      async saveExam(examData) {
        if (examData.id) {
          const id = examData.id;
          const copy = { ...examData };
          delete copy.id;
          await db.collection("exams").doc(id).set(copy, { merge: true });
          return id;
        } else {
          const res = await db.collection("exams").add(examData);
          return res.id;
        }
      },

      async deleteExam(examId) {
        // क्लाउड पर सॉफ्ट डिलीट ताकि हिस्ट्री सुरक्षित रहे
        await db.collection("exams").doc(examId).update({ isDeleted: true, updatedAt: Date.now() });
      },

      async getExamByCode(code) {
        const cleanCode = String(code).trim().toUpperCase();
        const snap = await db.collection("exams").where("isDeleted", "==", false).get();
        let found = null;
        snap.forEach(doc => {
          const d = doc.data();
          if (String(d.examCode).trim().toUpperCase() === cleanCode) {
            found = { id: doc.id, ...d };
          }
        });
        return found;
      },

      async submitExamResult(resultData) {
        const res = await db.collection("results").add(resultData);
        return res.id;
      }
    };
        /* ==================== TEACHER DASHBOARD ==================== */
    async function renderTeacherDashboard(c) {
      if (!state.activeTeacher) {
        try {
          const saved = localStorage.getItem("sep_teacher");
          if (saved) state.activeTeacher = JSON.parse(saved);
        } catch(e) {}
      }
      if (!state.activeTeacher) {
        state.activeTeacher = { id: "teacher_default", name: "Krishna Sir", email: "krishna@portal.com", photo: "" };
      }

      const teacherId = state.activeTeacher.id;
      let cachedExams = readCachedList("exams", teacherId) || [];
      let cachedResults = readCachedList("results", teacherId) || [];

      // स्क्रीन तुरंत कैश से लोड करें
      renderFullDashboardUI(c, cachedExams, cachedResults);

      try {
        const [cloudExams, cloudResults] = await Promise.all([
          API.getTeacherExams(teacherId),
          API.getResults(teacherId)
        ]);

        const examsList = (Array.isArray(cloudExams) && cloudExams.length > 0) ? cloudExams : cachedExams;
        const resultsList = (Array.isArray(cloudResults) && cloudResults.length > 0) ? cloudResults : cachedResults;

        writeCachedList("exams", teacherId, examsList);
        writeCachedList("results", teacherId, resultsList);

        renderFullDashboardUI(c, examsList, resultsList);
      } catch (err) {
        console.error("Dashboard Load Error:", err);
      }
    }

    function renderFullDashboardUI(c, exams, results) {
      exams = (exams || []).filter(e => e && !e.isDeleted);
      results = results || [];

      let filteredExams = exams.slice();

      // केवल तभी सर्च फ़िल्टर लागू करें जब कुछ टाइप किया गया हो
      if (state.examSearchQuery && state.examSearchQuery.trim() !== '') {
        const q = state.examSearchQuery.toLowerCase().trim();
        filteredExams = filteredExams.filter(e =>
          (e.examName || "").toLowerCase().includes(q) ||
          (e.examCode || "").toLowerCase().includes(q) ||
          (e.subject || "").toLowerCase().includes(q)
        );
      }

      // वर्ग फ़िल्टर
      if (state.examClassFilter && state.examClassFilter !== "All" && state.examClassFilter !== "सभी वर्ग") {
        filteredExams = filteredExams.filter(e => (e.class || e.targetClass) === state.examClassFilter);
      }

      // क्रमबद्धता
      if (state.examSortOrder === "az") {
        filteredExams.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      } else {
        filteredExams.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      }

      c.innerHTML = `
        <div class="space-y-6">
          <!-- प्रोफ़ाइल व क्विक एक्शन हेडर -->
          <div class="bg-white rounded-2xl p-5 shadow-sm border flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
              <div class="w-14 h-14 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-2xl font-black border-2 border-indigo-600 shadow-md overflow-hidden">
                ${state.activeTeacher.photo ? `<img src="${state.activeTeacher.photo}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-user-tie"></i>`}
              </div>
              <div>
                <h2 class="text-xl font-black text-slate-800">${escapeHtml(state.activeTeacher.name)}</h2>
                <p class="text-xs text-slate-500">डैशबोर्ड से परीक्षा और परिणाम मैनेज करें</p>
              </div>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="navigate('create-exam')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> + Create Exam
              </button>
              <button onclick="navigate('teacher-results')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 text-xs font-bold px-3 py-2 rounded-xl shadow transition">
                <i class="fa-solid fa-square-poll-vertical"></i> Results
              </button>
            </div>
          </div>

          <!-- आँकड़े कार्ड (Stats) -->
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-2xl border shadow-sm cursor-pointer hover:border-indigo-400 transition" onclick="resetFiltersAndRefresh()">
              <span class="text-xs text-slate-500 font-semibold">Active Exams 👉</span>
              <span class="text-2xl font-black text-indigo-600 block mt-1">${exams.length}</span>
            </div>
            <div class="bg-white p-4 rounded-2xl border shadow-sm cursor-pointer hover:border-indigo-400 transition" onclick="navigate('teacher-results')">
              <span class="text-xs text-slate-500 font-semibold">Total Records 👉</span>
              <span class="text-2xl font-black text-emerald-600 block mt-1">${results.length}</span>
            </div>
          </div>

          <!-- सर्च व वर्ग फ़िल्टर बार -->
          <div class="bg-white rounded-2xl p-4 border shadow-sm space-y-3">
            <div class="flex flex-wrap justify-between items-center gap-3">
              <h3 class="font-bold text-slate-800 text-sm">मेरी परीक्षाएं (${filteredExams.length})</h3>
              <div class="flex flex-wrap items-center gap-2">
                <select onchange="onClassFilterChange(this.value)" class="text-xs border rounded-lg p-1.5 font-medium bg-slate-50">
                  <option value="All" ${state.examClassFilter === 'All' ? 'selected' : ''}>सभी वर्ग</option>
                  <option value="Class 10" ${state.examClassFilter === 'Class 10' ? 'selected' : ''}>Class 10</option>
                  <option value="Class 12" ${state.examClassFilter === 'Class 12' ? 'selected' : ''}>Class 12</option>
                  <option value="Class 11" ${state.examClassFilter === 'Class 11' ? 'selected' : ''}>Class 11</option>
                  <option value="Class 9" ${state.examClassFilter === 'Class 9' ? 'selected' : ''}>Class 9</option>
                  <option value="Class 8" ${state.examClassFilter === 'Class 8' ? 'selected' : ''}>Class 8</option>
                </select>
                <button onclick="toggleSortOrder()" class="text-xs bg-slate-100 hover:bg-slate-200 px-2.5 py-1.5 rounded-lg border font-medium">
                  ${state.examSortOrder === 'az' ? 'A-Z (नई पहले)' : 'Z-A (पुरानी पहले)'}
                </button>
              </div>
            </div>
            <input type="text" placeholder="🔍 परीक्षा का नाम या कोड लिखकर तुरंत सर्च करें..." value="${escapeHtml(state.examSearchQuery)}"
              oninput="onSearchInput(this.value)" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 focus:bg-white outline-none focus:border-indigo-500 transition" />
          </div>

          <!-- परीक्षाओं की सूची -->
          <div class="space-y-3">
            ${filteredExams.length === 0 ? `
              <div class="bg-white p-8 rounded-2xl border text-center text-slate-400 text-sm">
                कोई परीक्षा नहीं मिली। नया पेपर बनाने के लिए ऊपर "+ Create Exam" पर क्लिक करें।
              </div>
            ` : filteredExams.map(ex => `
              <div class="bg-white rounded-2xl p-4 border shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4 hover:border-indigo-300 transition">
                <div class="space-y-1">
                  <div class="flex items-center gap-2">
                    <span class="bg-indigo-100 text-indigo-800 text-[10px] font-black px-2 py-0.5 rounded uppercase font-mono">${escapeHtml(ex.examCode)}</span>
                    <span class="text-xs text-slate-400 font-medium">${formatDate(ex.createdAt)}</span>
                    <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-semibold">${escapeHtml(ex.class || 'सामान्य')}</span>
                  </div>
                  <h4 class="font-bold text-slate-800 text-sm">${escapeHtml(ex.examName)}</h4>
                  <p class="text-xs text-slate-500">कुल प्रश्न: <b>${(ex.questions \vert{}\vert{} []).length}</b> \vert{} समय: <b>${ex.timingType === 'limited' ? ex.duration + ' मिनट' : 'असीमित'}</b></p>
                </div>
                <div class="flex items-center gap-2 self-end md:self-center">
                  <button onclick="editExam('${ex.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-1.5 rounded-lg border font-bold">संपादित करें</button>
                  <button onclick="confirmDeleteExam('${ex.id}', '${escapeHtml(ex.examName)}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs px-3 py-1.5 rounded-lg border border-rose-200 font-bold">हटाएँ</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function onSearchInput(val) {
      state.examSearchQuery = val;
      renderTeacherDashboard(document.getElementById('app'));
    }

    function onClassFilterChange(val) {
      state.examClassFilter = val;
      renderTeacherDashboard(document.getElementById('app'));
    }

    function toggleSortOrder() {
      state.examSortOrder = state.examSortOrder === 'az' ? 'za' : 'az';
      renderTeacherDashboard(document.getElementById('app'));
    }

    function resetFiltersAndRefresh() {
      state.examSearchQuery = '';
      state.examClassFilter = 'All';
      renderTeacherDashboard(document.getElementById('app'));
     }
        /* ==================== CREATE & EDIT EXAM ==================== */
    function renderCreateExam(c) {
      if (!state.builderExam) {
        state.builderExam = {
          examName: '',
          examCode: 'EX' + Math.floor(100 + Math.random() * 900),
          class: 'Class 10',
          subject: 'विज्ञान',
          timingType: 'unlimited',
          duration: 30,
          questions: [
            { questionText: '', options: ['', '', '', ''], correctIndex: 0, imageUrl: '' }
          ]
        };
      }
      const ex = state.builderExam;
      const isEditing = Boolean(ex.id);

      c.innerHTML = `
        <div class="space-y-6">
          <div id="examBuilderToolbar" class="bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-center">
            <div>
              <h2 class="text-base font-black text-slate-800">${isEditing ? 'परीक्षा संपादित करें' : 'नई परीक्षा बनाएँ'}</h2>
              <span class="text-xs text-slate-500">सभी प्रश्न व डायग्राम सही से भरें</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="navigate('teacher-dash')" class="bg-slate-100 hover:bg-slate-200 text-xs font-bold px-3 py-2 rounded-xl border">रद्द करें</button>
              <button onclick="saveExam('published')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow flex items-center gap-1.5 transition">
                <i class="fa-solid fa-cloud-arrow-up"></i> ${isEditing ? 'अपडेट करें' : 'पब्लिश करें'}
              </button>
            </div>
          </div>

          <!-- परीक्षा विवरण इनपुट -->
          <div class="bg-white p-5 rounded-2xl border shadow-sm grid md:grid-cols-2 gap-4 text-xs">
            <div>
              <label class="font-bold text-slate-700 block mb-1">परीक्षा का नाम:</label>
              <input type="text" id="bName" value="${escapeHtml(ex.examName)}" placeholder="उदा. 10th विज्ञान मासिक टेस्ट" class="w-full p-2.5 border rounded-xl bg-slate-50 focus:bg-white outline-none focus:border-indigo-500 font-semibold" />
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">परीक्षा कोड (Unique Code):</label>
              <input type="text" id="bCode" value="${escapeHtml(ex.examCode)}" placeholder="उदा. SC10" class="w-full p-2.5 border rounded-xl bg-slate-50 focus:bg-white outline-none focus:border-indigo-500 font-mono font-bold uppercase" />
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">वर्ग (Class):</label>
              <select id="bClass" class="w-full p-2.5 border rounded-xl bg-slate-50 font-semibold">
                ${['Class 10', 'Class 12', 'Class 11', 'Class 9', 'Class 8'].map(cls => `
                  <option value="${cls}" ${ex.class === cls ? 'selected' : ''}>${cls}</option>
                `).join('')}
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">समय सीमा (Timing):</label>
              <select id="bTiming" onchange="toggleTimingInput(this.value)" class="w-full p-2.5 border rounded-xl bg-slate-50 font-semibold">
                <option value="unlimited" ${ex.timingType === 'unlimited' ? 'selected' : ''}>असीमित समय (No Timer)</option>

    function toggleTimingInput(val) {
      const durDiv = document.getElementById("durDiv");
      if (durDiv) {
        if (val === 'limited') durDiv.classList.remove('hidden');
        else durDiv.classList.add('hidden');
      }
    }

    function syncCurrentQuestions() {
      if (!state.builderExam) return;
      const bName = document.getElementById("bName");
      const bCode = document.getElementById("bCode");
      const bClass = document.getElementById("bClass");
      const bTiming = document.getElementById("bTiming");
      const bDuration = document.getElementById("bDuration");

      if (bName) state.builderExam.examName = bName.value;
      if (bCode) state.builderExam.examCode = bCode.value;
      if (bClass) state.builderExam.class = bClass.value;
      if (bTiming) state.builderExam.timingType = bTiming.value;
      if (bDuration) state.builderExam.duration = parseInt(bDuration.value) || 30;

      state.builderExam.questions.forEach((q, i) => {
        const t = document.getElementById(`qText_${i}`);
        if (t) q.questionText = t.value;
        [0, 1, 2, 3].forEach(oi => {
          const opt = document.getElementById(`qOpt_${i}_${oi}`);
          if (opt) q.options[oi] = opt.value;
        });
        const cor = document.getElementById(`qCorrect_${i}`);
        if (cor) q.correctIndex = parseInt(cor.value) || 0;
      });
    }

    function addNewQuestion() {
      syncCurrentQuestions();
      state.builderExam.questions.push({
        questionText: '',
        options: ['', '', '', ''],
        correctIndex: 0,
        imageUrl: ''
      });
      renderCreateExam(document.getElementById('app'));
    }

    function removeQuestion(i) {
      syncCurrentQuestions();
      if (state.builderExam.questions.length > 1) {
        state.builderExam.questions.splice(i, 1);
        renderCreateExam(document.getElementById('app'));
      }
    }
        /* ==================== SAVE EXAM & DELETE GUARDS ==================== */
    async function saveExam(status) {
      // 1. बटन को तुरंत डिसेबल (लॉक) करें ताकि बार-बार क्लिक से 20-25 डुप्लिकेट न बनें
      const saveBtns = document.querySelectorAll("button[onclick*='saveExam']");
      saveBtns.forEach(b => {
        b.disabled = true;
        b.dataset.oldText = b.innerText;
        b.innerText = "⏳ सुरक्षित हो रहा है...";
      });

      const unlockButtons = () => {
        saveBtns.forEach(b => {
          b.disabled = false;
          b.innerText = b.dataset.oldText || "सुरक्षित करें";
        });
      };

      syncCurrentQuestions();
      const ex = state.builderExam;
      if (!ex) { unlockButtons(); return; }

      const teacherId = state.activeTeacher?.id || "teacher_default";
      ex.teacherId = teacherId;
      ex.teacherName = state.activeTeacher?.name || "Krishna Sir";
      ex.teacherEmail = state.activeTeacher?.email || "";

      const cleanName = (ex.examName || "").trim();
      const cleanCode = (ex.examCode || "").trim().toUpperCase();

      if (!cleanName || !cleanCode) {
        alert("कृपया परीक्षा का नाम और कोड अवश्य भरें!");
        unlockButtons();
        return;
      }

      ex.examName = cleanName;
      ex.examCode = cleanCode;
      ex.status = status;
      ex.isDeleted = false;
      ex.updatedAt = Date.now();

      try {
        // 2. यदि नया पेपर है, तो जाँचें कि इस कोड से परीक्षा पहले से तो मौजूद नहीं है
        if (!ex.id) {
          const existingExams = await API.getTeacherExams(teacherId);
          const duplicate = existingExams.find(e => !e.isDeleted && String(e.examCode || "").trim().toUpperCase() === cleanCode);
          if (duplicate) {
            alert(`⚠️ कोड "${cleanCode}" से परीक्षा पहले से मौजूद है! एक ही कोड की परीक्षा बार-बार नहीं बनाई जा सकती।`);
            unlockButtons();
            return;
          }
        }

        const savedId = await API.saveExam(ex);
        ex.id = savedId;
        upsertCachedItem("exams", teacherId, ex);

        alert("परीक्षा सफलतापूर्वक सुरक्षित हो गई!");
        state.builderExam = null;
        navigate("teacher-dash");
      } catch (err) {
        alert("त्रुटि: " + err.message);
        unlockButtons();
      }
    }

    async function confirmDeleteExam(examId, examName) {
      if (!confirm(`क्या आप परीक्षा "${examName}" को हटाना चाहते हैं?`)) return;

      try {
        await API.deleteExam(examId);

        // लोकल कैश से केवल उसी परीक्षा को निकालें (ताकि बाकी 0 न हों)
        const teacherId = state.activeTeacher?.id || "teacher_default";
        let currentList = readCachedList("exams", teacherId) || [];
        currentList = currentList.filter(e => e.id !== examId);
        writeCachedList("exams", teacherId, currentList);

        alert("परीक्षा हटा दी गई!");
        renderTeacherDashboard(document.getElementById('app'));
      } catch (err) {
        alert("हटाने में समस्या आई: " + err.message);
      }
    }

    function editExam(examId) {
      const teacherId = state.activeTeacher?.id || "teacher_default";
      const list = readCachedList("exams", teacherId);
      const target = list.find(x => x.id === examId);
      if (target) {
        state.builderExam = JSON.parse(JSON.stringify(target));
        navigate("create-exam");
      }
    }

    async function startStudentExam() {
      const name = document.getElementById("stuName")?.value.trim();

      const roll = document.getElementById("stuRoll")?.value.trim();
      const code = document.getElementById("stuCode")?.value.trim().toUpperCase();

      const exam = await API.getExamByCode(code);

        return alert(`⚠️ कोड "${code}" से कोई सक्रिय परीक्षा नहीं मिली। कृपया सही कोड डालें।`);
      }

      state.activeStudent = { name, class: sClass, roll, answers: {} };
      state.activeStudentExam = exam;
      navigate("student-exam");

    function selectStudentAnswer(qIndex, optionIndex) {

    async function submitStudentExam() {
      if (!confirm("क्या आप वाकई परीक्षा सबमिट करना चाहते हैं?")) return;

      const ex = state.activeStudentExam;
      const stu = state.activeStudent;
      let score = 0;

      ex.questions.forEach((q, i) => {
        if (stu.answers[i] !== undefined && parseInt(stu.answers[i]) === parseInt(q.correctIndex)) {
          score++;
        }
      });

      const resultPayload = {
        examId: ex.id,
        examName: ex.examName,
        examCode: ex.examCode,
        studentName: stu.name,
        studentRoll: stu.roll,
        studentClass: stu.class,
        score: score,
        totalMarks: ex.questions.length,
        answers: stu.answers,
        submittedAt: Date.now(),
        teacherId: ex.teacherId || "teacher_default"
      };

      try {
        await API.submitExamResult(resultPayload);
        state.lastResult = resultPayload;
        navigate("student-result");
      } catch (err) {
        alert("परिणाम सुरक्षित करने में त्रुटि: " + err.message);
      }
     }

    /* ==================== CENTRAL ROUTER (NAVIGATE) ==================== */
    function navigate(view) {
      window.location.hash = view;
      const app = document.getElementById("app");
      window.scrollTo(0, 0);

      switch (view) {
        case 'home':
        case 'teacher-dash':
        case 'teacher-dashboard':
          renderTeacherDashboard(app);
          break;
        case 'create-exam':
          renderCreateExam(app);
          break;
        case 'student-home':
          renderStudentHome(app);
          break;
        case 'student-exam':
          renderStudentExam(app);
          break;
        case 'student-result':
          renderStudentResult(app);
          break;
        default:
          renderTeacherDashboard(app);
          break;
      }
    }

      alert("लॉगआउट सफल!");

      const hash = window.location.hash.replace("#", "") || "teacher-dash";
      navigate(hash);
    });
  </script>
